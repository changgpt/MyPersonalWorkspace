{% extends "base.html" %}
{% block title %}Edit task — Daybook{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit task</h2></div>

<form method="post" action="{{ url_for('tasks.update_view', task_id=task['id']) }}">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" required value="{{ task['title'] }}">

  <label for="description">Description</label>
  <textarea id="description" name="description" style="min-height:120px;">{{ task['description'] }}</textarea>

  <div class="form-row">
    <div>
      <label for="priority">Priority</label>
      <select id="priority" name="priority">
        {% for p in priorities %}
          <option value="{{ p }}" {{ 'selected' if task['priority'] == p }}>{{ p }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="due_date">Due date</label>
      <input type="date" id="due_date" name="due_date" value="{{ task['due_date'] or '' }}">
    </div>
    <div>
      <label for="project_id">Project</label>
      <select id="project_id" name="project_id">
        <option value="">None</option>
        {% for p in projects %}
          <option value="{{ p['id'] }}" {{ 'selected' if task['project_id'] == p['id'] }}>{{ p['name'] }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <label style="display:flex; align-items:center; gap:8px; font-weight:normal; margin-top:16px;">
    <input type="checkbox" name="is_today" value="1" {{ 'checked' if task['is_today'] }} style="width:auto;">
    Flag for today
  </label>

  {% if task['source_note_id'] %}
  <p class="flash-hint">Created from a note: <a href="{{ url_for('notes.detail_view', note_id=task['source_note_id']) }}">view note</a></p>
  {% endif %}

  <div style="margin-top: 24px;">
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('tasks.today_view') }}">Cancel</a>
  </div>
</form>

<form method="post" action="{{ url_for('tasks.delete_view', task_id=task['id']) }}"
      onsubmit="return confirm('Delete this task?')" style="margin-top: 12px;">
  <button class="btn btn-danger" type="submit">Delete task</button>
</form>
{% endblock %}
