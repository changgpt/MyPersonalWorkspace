{% extends "base.html" %}
{% block title %}Edit log entry — FiloFax{% endblock %}
{% block content %}
<div class="page-header"><h2>Edit log entry</h2></div>

<form method="post" action="{{ url_for('activity.log_entry_update_view', log_entry_id=log_entry['id']) }}">
  <label for="entry_date">Date</label>
  <input type="date" id="entry_date" name="entry_date" required value="{{ log_entry['entry_date'] }}">

  <label for="description">Description</label>
  <textarea id="description" name="description" required style="min-height:100px;">{{ log_entry['description'] }}</textarea>

  <div class="form-row">
    <div>
      <label for="project_id">Project</label>
      <select id="project_id" name="project_id">
        <option value="">None</option>
        {% for p in projects %}
          <option value="{{ p['id'] }}" {{ 'selected' if log_entry['project_id'] == p['id'] }}>{{ p['name'] }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="time_spent">Time spent</label>
      <input type="text" id="time_spent" name="time_spent" value="{{ log_entry['time_spent'] or '' }}">
    </div>
  </div>

  <div style="margin-top: 24px;">
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-secondary" href="{{ url_for('activity.list_view') }}">Cancel</a>
  </div>
</form>

<form method="post" action="{{ url_for('activity.log_entry_delete_view', log_entry_id=log_entry['id']) }}"
      onsubmit="return confirm('Delete this log entry?')" style="margin-top: 12px;">
  <button class="btn btn-danger" type="submit">Delete</button>
</form>

<h3>Skills</h3>
{% include "skills/_tagger.html" %}
{% endblock %}
