{% extends "base.html" %}
{% block title %}Activity log — FiloFax{% endblock %}
{% block content %}
<div class="page-header"><h2>Activity log</h2></div>

<form class="filter-bar" method="get"
      hx-get="{{ url_for('activity.list_view') }}"
      hx-trigger="change"
      hx-target="#activity-items"
      hx-swap="outerHTML"
      hx-push-url="true"
      hx-indicator="#activity-items">
  <select name="project">
    <option value="">All projects</option>
    {% for p in projects %}
      <option value="{{ p['id'] }}" {{ 'selected' if filters.project_id == p['id'] }}>{{ p['name'] }}</option>
    {% endfor %}
  </select>
  <input type="date" name="from" value="{{ filters.date_from or '' }}">
  <input type="date" name="to" value="{{ filters.date_to or '' }}">
  <a class="btn btn-secondary" href="{{ url_for('activity.list_view') }}">Clear</a>
</form>

{# Adding an entry prepends it to the list in place rather than reloading. #}
<form class="filter-bar" method="post" action="{{ url_for('activity.create_view') }}"
      hx-post="{{ url_for('activity.create_view') }}"
      hx-target="#activity-items"
      hx-swap="outerHTML"
      hx-on::after-request="this.querySelector('input[name=description]').value = ''">
  <input type="date" name="entry_date" required value="{{ filters.date_to or today }}">
  <input type="text" name="description" placeholder="What did you do?" required style="width: 280px;">
  <select name="project_id">
    <option value="">No project</option>
    {% for p in projects %}
      <option value="{{ p['id'] }}">{{ p['name'] }}</option>
    {% endfor %}
  </select>
  <input type="text" name="time_spent" placeholder="Time spent (optional)" style="width: 140px;">
  <button class="btn" type="submit">Add</button>
</form>

{% include "activity/_items.html" %}
{% endblock %}
